name: Update MaxMind GeoLite2 Database

on:
  schedule:
    # Run every Monday at 3 AM UTC (MaxMind updates their database weekly)
    - cron: "0 3 * * 1"
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GeoLite2 databases
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          download_edition() {
            local edition="$1"
            echo "Downloading ${edition}..."
            if ! curl -f -L -o "${edition}.tar.gz" \
              "https://download.maxmind.com/app/geoip_download?edition_id=${edition}&license_key=${MAXMIND_LICENSE_KEY}&suffix=tar.gz"; then
              echo "Error: Failed to download ${edition} from MaxMind"
              echo "Check that license key is valid and has not expired"
              exit 1
            fi
          }

          download_edition "GeoLite2-City"
          download_edition "GeoLite2-ASN"

          echo "Downloads complete"

      - name: Extract database files
        run: |
          extract_mmdb() {
            local edition="$1"
            echo "Extracting ${edition}..."
            tar -xzf "${edition}.tar.gz"

            # Find the .mmdb file (it's in a dated subdirectory like GeoLite2-City_20231010/)
            local mmdb_file
            mmdb_file=$(find . -name "${edition}.mmdb" -type f | head -n 1)

            if [ -z "$mmdb_file" ]; then
              echo "Error: Could not find ${edition}.mmdb in extracted archive"
              exit 1
            fi

            # Move to predictable location
            mv "$mmdb_file" "${edition}.mmdb"
            echo "Database ready: $(ls -lh ${edition}.mmdb)"
          }

          extract_mmdb "GeoLite2-City"
          extract_mmdb "GeoLite2-ASN"

      - name: Generate release info
        id: release_info
        run: |
          # Generate release tag with date
          RELEASE_TAG="v$(date +%Y.%m.%d)"
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          # Get file info for release notes
          CITY_SIZE_MB=$(( $(stat -c%s GeoLite2-City.mmdb) / 1024 / 1024 ))
          ASN_SIZE_MB=$(( $(stat -c%s GeoLite2-ASN.mmdb) / 1024 / 1024 ))

          # Generate release body
          cat > release_notes.md << EOF
          # MaxMind GeoLite2 Database Update

          **Updated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Editions:** GeoLite2-City (${CITY_SIZE_MB} MB), GeoLite2-ASN (${ASN_SIZE_MB} MB)

          ## Download URLs
          \`\`\`
          https://github.com/\${{ github.repository }}/releases/download/${RELEASE_TAG}/GeoLite2-City.mmdb
          https://github.com/\${{ github.repository }}/releases/download/${RELEASE_TAG}/GeoLite2-ASN.mmdb
          \`\`\`

          ## Latest (always current)
          \`\`\`bash
          curl -L -o GeoLite2-City.mmdb https://github.com/\${{ github.repository }}/releases/latest/download/GeoLite2-City.mmdb
          curl -L -o GeoLite2-ASN.mmdb  https://github.com/\${{ github.repository }}/releases/latest/download/GeoLite2-ASN.mmdb
          \`\`\`

          ---
          *These databases are updated weekly via automated workflow*
          EOF

          echo "Release notes generated"

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get count of releases
          RELEASE_COUNT=$(gh release list --limit 100 | wc -l)

          if [ "$RELEASE_COUNT" -gt 0 ]; then
            echo "Found ${RELEASE_COUNT} existing releases"
            # Keep only the latest, delete all others
            gh release list --limit 100 | tail -n +2 | cut -f1 | while read -r tag; do
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes 2>/dev/null || true
            done
            echo "Old releases deleted"
          else
            echo "No existing releases to delete"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.release_info.outputs.tag }} \
            GeoLite2-City.mmdb \
            GeoLite2-ASN.mmdb \
            --title "GeoLite2 $(date +%Y-%m-%d)" \
            --notes-file release_notes.md \
            --latest

      - name: Verify release
        run: |
          echo "✅ Release created successfully!"
          echo ""
          echo "Download URLs:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/GeoLite2-City.mmdb"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/GeoLite2-ASN.mmdb"
          echo ""
          echo "Latest URLs (always current):"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/GeoLite2-City.mmdb"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/GeoLite2-ASN.mmdb"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::MaxMind database update failed. Check workflow logs for details."
